<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runtime constraint: HMR is disabled in AI Studio container. Intercept WebSocket & prevent unhandled errors.
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          class MockViteWebSocket extends EventTarget {
            static CONNECTING = 0;
            static OPEN = 1;
            static CLOSING = 2;
            static CLOSED = 3;

            CONNECTING = 0;
            OPEN = 1;
            CLOSING = 2;
            CLOSED = 3;

            readyState = 1; // 1 = OPEN
            bufferedAmount = 0;
            extensions = '';
            protocol = 'vite-hmr';
            binaryType = 'blob';
            url = '';

            onopen = null;
            onclose = null;
            onerror = null;
            onmessage = null;

            constructor(url, protocols) {
              super();
              this.url = String(url || '');
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
              this.readyState = 1;
              setTimeout(() => {
                try {
                  var ev = new Event('open');
                  this.dispatchEvent(ev);
                  if (typeof this.onopen === 'function') this.onopen(ev);
                } catch (e) {}
              }, 0);
            }

            send(data) {}

            close(code, reason) {
              this.readyState = 3;
              try {
                var ev = new Event('close');
                this.dispatchEvent(ev);
                if (typeof this.onclose === 'function') this.onclose(ev);
              } catch (e) {}
            }
          }

          MockViteWebSocket.prototype.CONNECTING = 0;
          MockViteWebSocket.prototype.OPEN = 1;
          MockViteWebSocket.prototype.CLOSING = 2;
          MockViteWebSocket.prototype.CLOSED = 3;

          window.WebSocket = new Proxy(NativeWebSocket, {
            construct(target, args) {
              // Return mock for all connections in dev environment
              return new MockViteWebSocket(args[0], args[1]);
            },
          });
        }

        var prevOnError = window.onerror;
        window.onerror = function (msg, url, line, col, error) {
          var s = String(msg || '') + ' ' + String(url || '');
          if (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('@vite/client') !== -1 ||
            s.indexOf('model-viewer') !== -1 ||
            s.indexOf('GLTFLoader') !== -1 ||
            s.indexOf('Unexpected token') !== -1 ||
            s.indexOf('JSON.parse') !== -1
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError(msg, url, line, col, error);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
          var str = String(event.reason && (event.reason.message || event.reason.stack || event.reason));
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('ws') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('model-viewer') !== -1 ||
            str.indexOf('GLTFLoader') !== -1 ||
            str.indexOf('Unexpected token') !== -1 ||
            str.indexOf('JSON.parse') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        });

        window.addEventListener('error', function (event) {
          var msg = String(event.message || '');
          var file = String(event.filename || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            file.indexOf('model-viewer') !== -1 ||
            msg.indexOf('model-viewer') !== -1 ||
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('JSON.parse') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        });
      })();
    </script>
    <title>AtelierAI - Intelligent Interior & 3D Spatial Design</title>
    <meta name="description" content="AI-powered interior design studio featuring intelligent intent routing, photorealistic 2D room conceptualization, and interactive 3D furniture models with Google model-viewer." />
    <meta property="og:title" content="AtelierAI - Intelligent Interior & 3D Spatial Design" />
    <meta property="og:description" content="AI-powered interior design studio featuring intelligent intent routing, photorealistic 2D room conceptualization, and interactive 3D furniture models with Google model-viewer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts for Architectural Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google <model-viewer> CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
